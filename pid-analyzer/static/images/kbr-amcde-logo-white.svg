<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120">
  <!-- Globe - Main arc (large sweeping curve from bottom-left to upper-right) -->
  <path d="M 23 98 Q 18 30 80 10 Q 105 2 112 30" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Globe - Inner arc -->
  <path d="M 30 92 Q 32 40 75 22" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Globe - horizontal arc line (latitude) -->
  <path d="M 18 65 Q 55 50 100 65" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>

  <!-- Sun burst (golden yellow rays at top-left of globe) -->
  <circle cx="40" cy="12" r="5.5" fill="#e8b500"/>
  <line x1="40" y1="1" x2="40" y2="5" stroke="#e8b500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="5" x2="33" y2="8" stroke="#e8b500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="27" y1="14" x2="31" y2="13" stroke="#e8b500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="5" x2="48" y2="8" stroke="#e8b500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="53" y1="12" x2="49" y2="12" stroke="#e8b500" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="21" x2="35" y2="17" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="47" y1="21" x2="46" y2="17" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Scattered pixel squares (between globe top and KBR text) -->
  <rect x="72" y="12" width="9" height="9" fill="rgba(255,255,255,0.85)" rx="1.5"/>
  <rect x="85" y="6" width="8" height="8" fill="rgba(255,255,255,0.5)" rx="1.5"/>
  <rect x="96" y="14" width="7" height="7" fill="rgba(255,255,255,0.35)" rx="1.5"/>
  <rect x="84" y="18" width="7" height="7" fill="#4a8c3f" rx="1.5"/>
  <rect x="72" y="25" width="6" height="6" fill="#4a8c3f" rx="1.5"/>
  <rect x="105" y="9" width="6" height="6" fill="#e8b500" rx="1.5"/>
  <rect x="98" y="4" width="5" height="5" fill="rgba(255,255,255,0.4)" rx="1"/>

  <!-- KBR text - bold white -->
  <text x="120" y="90" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="74" fill="#ffffff" letter-spacing="-2">KBR</text>

  <!-- Hyphen -->
  <text x="315" y="90" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="rgba(255,255,255,0.85)">-</text>

  <!-- AMCDE text - lighter white -->
  <text x="345" y="90" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="rgba(255,255,255,0.9)" letter-spacing="0">AMCDE</text>
</svg>
