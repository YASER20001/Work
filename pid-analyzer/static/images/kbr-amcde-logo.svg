<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <!-- Globe - Main arc (large swooping curve from bottom-left to upper-right) -->
  <path d="M 8 95 Q 10 20 75 8 Q 95 4 100 25" fill="none" stroke="#1a5091" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Globe - Inner arc -->
  <path d="M 14 88 Q 20 35 65 20" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
  <!-- Globe - horizontal arc line -->
  <path d="M 5 68 Q 45 55 85 68" fill="none" stroke="#1a5091" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sun burst (golden yellow rays at top-left of globe) -->
  <circle cx="28" cy="14" r="4.5" fill="#e8b500"/>
  <line x1="28" y1="4" x2="28" y2="7" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="19" y1="7" x2="21" y2="10" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="17" y1="16" x2="20" y2="15" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37" y1="7" x2="35" y2="10" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="39" y1="14" x2="36" y2="14" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="23" y2="19" stroke="#e8b500" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="22" x2="33" y2="19" stroke="#e8b500" stroke-width="2" stroke-linecap="round"/>

  <!-- Scattered pixel squares (above KBR text, near globe top) -->
  <rect x="62" y="14" width="8" height="8" fill="#1a1a1a" rx="1"/>
  <rect x="73" y="8" width="7" height="7" fill="#003a70" rx="1"/>
  <rect x="83" y="16" width="6" height="6" fill="#1a5091" rx="1"/>
  <rect x="72" y="19" width="5.5" height="5.5" fill="#4a8c3f" rx="1"/>
  <rect x="62" y="26" width="5" height="5" fill="#4a8c3f" rx="1"/>
  <rect x="91" y="10" width="5" height="5" fill="#e8b500" rx="1"/>
  <rect x="85" y="6" width="4" height="4" fill="#7cb89c" rx="1"/>

  <!-- KBR text - bold heavy navy -->
  <text x="105" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="72" fill="#003a70" letter-spacing="-2">KBR</text>

  <!-- Hyphen -->
  <text x="305" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="#003a70">-</text>

  <!-- AMCDE text - bold blue -->
  <text x="335" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="#005bac" letter-spacing="0">AMCDE</text>
</svg>
