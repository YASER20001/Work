<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120">
  <!-- Globe - Main arc (large swooping curve from bottom-left to upper-right) -->
  <path d="M 23 95 Q 25 20 90 8 Q 110 4 115 25" fill="none" stroke="#1a5091" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Globe - Inner arc -->
  <path d="M 29 88 Q 35 35 80 20" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
  <!-- Globe - horizontal arc line -->
  <path d="M 20 68 Q 60 55 100 68" fill="none" stroke="#1a5091" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sun burst (golden yellow rays at top-left of globe) -->
  <circle cx="43" cy="14" r="4.5" fill="#e8b500"/>
  <line x1="43" y1="4" x2="43" y2="7" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="7" x2="36" y2="10" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="35" y2="15" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="52" y1="7" x2="50" y2="10" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="54" y1="14" x2="51" y2="14" stroke="#e8b500" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37" y1="22" x2="38" y2="19" stroke="#e8b500" stroke-width="2" stroke-linecap="round"/>
  <line x1="49" y1="22" x2="48" y2="19" stroke="#e8b500" stroke-width="2" stroke-linecap="round"/>

  <!-- Scattered pixel squares (above KBR text, near globe top) -->
  <rect x="77" y="14" width="8" height="8" fill="#1a1a1a" rx="1"/>
  <rect x="88" y="8" width="7" height="7" fill="#003a70" rx="1"/>
  <rect x="98" y="16" width="6" height="6" fill="#1a5091" rx="1"/>
  <rect x="87" y="19" width="5.5" height="5.5" fill="#4a8c3f" rx="1"/>
  <rect x="77" y="26" width="5" height="5" fill="#4a8c3f" rx="1"/>
  <rect x="106" y="10" width="5" height="5" fill="#e8b500" rx="1"/>
  <rect x="100" y="6" width="4" height="4" fill="#7cb89c" rx="1"/>

  <!-- KBR text - bold heavy navy -->
  <text x="120" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="72" fill="#003a70" letter-spacing="-2">KBR</text>

  <!-- Hyphen -->
  <text x="320" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="#003a70">-</text>

  <!-- AMCDE text - bold blue -->
  <text x="350" y="88" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="68" fill="#005bac" letter-spacing="0">AMCDE</text>
</svg>
